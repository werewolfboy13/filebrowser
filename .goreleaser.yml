version: 2

project_name: filebrowser

env:
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0
    # The commit is cut to seven characters, as in the Docker image and in `task build`.
    # ShortCommit is as long as Git makes it in the clone at hand, which is seven or more.
    ldflags:
      - -s -w -X github.com/werewolfboy13/filebrowser/v3/version.Version={{ .Version }} -X github.com/werewolfboy13/filebrowser/v3/version.CommitSHA={{ slice .FullCommit 0 7 }}
    main: main.go
    binary: filebrowser
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
      - riscv64
    goarm:
      - "5"
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      # Experimental, may not work properly
      - goos: openbsd
        goarch: riscv64
      # Broken as of Go 1.24, deprecated as of Go 1.26
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      # Does not compile: gopsutil, which reads the disk usage, has no code for it
      - goos: freebsd
        goarch: riscv64

archives:
  - name_template: "{{.Os}}-{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}-{{ .ProjectName }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    # A tar archive names the owner and the group of each file, and GoReleaser takes them from the
    # files on disk: the archives would name the account that the release was built with. Every
    # file belongs to root instead, the binary and the files that come with it. Those are the ones
    # GoReleaser adds by itself when none is listed, written out because the owner is set per file.
    builds_info:
      owner: root
      group: root
    files:
      - src: LICENSE
        info: &root
          owner: root
          group: root
      - src: README.md
        info: *root
      - src: CHANGELOG.md
        info: *root

# A tag with a suffix, such as v3.0.0-rc.1, becomes a prerelease on GitHub, which is not shown as
# the latest release.
release:
  prerelease: auto

# The Docker image is not built here. The Dockerfile builds File Browser from source, in a build
# context that is the whole repository, where GoReleaser would give it a context with only the
# binary it built. The release job of .github/workflows/ci.yaml builds and pushes the image.

# The release is created in the repository that the tag was pushed to, which GoReleaser reads from
# the checkout. Nothing here names a repository or a homepage, so nothing here points at the
# original project.

# No Homebrew cask is published: the tap it went to belongs to the original File Browser project.
