version: 2

project_name: filebrowser

env:
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/filebrowser/filebrowser/v2/version.Version={{ .Version }} -X github.com/filebrowser/filebrowser/v2/version.CommitSHA={{ .ShortCommit }}
    main: main.go
    binary: filebrowser
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
      - riscv64
    goarm:
      - "5"
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      # Experimental, may not work properly
      - goos: openbsd
        goarch: riscv64
      # Broken as of Go 1.24, deprecated as of Go 1.26
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      # Does not compile: gopsutil, which reads the disk usage, has no code for it
      - goos: freebsd
        goarch: riscv64

archives:
  - name_template: "{{.Os}}-{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}-{{ .ProjectName }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]

# A tag with a suffix, such as v3.0.0-rc.1, becomes a prerelease on GitHub, which is not shown as
# the latest release.
release:
  prerelease: auto

# The Docker image is not built here. The Dockerfile builds File Browser from source, in a build
# context that is the whole repository, where GoReleaser would give it a context with only the
# binary it built. The release job of .github/workflows/ci.yaml builds and pushes the image.

# No Homebrew cask is published: the tap it went to belongs to the File Browser project.
