version: '3'

vars:
  # Whether a release is signed, its commit and its tag: -s for signed, '' for unsigned. This is
  # the one place that decides it.
  SIGN: -s

tasks:
  build:frontend:
    desc: Build frontend assets
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run build

  build:backend:
    desc: Build backend binary
    cmds:
      - go build -ldflags='-s -w -X "github.com/werewolfboy13/filebrowser/v3/version.Version={{.VERSION}}" -X "github.com/werewolfboy13/filebrowser/v3/version.CommitSHA={{.GIT_COMMIT}}"' -o filebrowser .
    vars:
      # Seven characters, as in the released binaries and in the Docker image.
      GIT_COMMIT:
        sh: git rev-parse --short=7 HEAD
      # The last version tag without its v, and for a build that is past it, by how many commits,
      # at which one, and whether with changes that are not committed: 2.63.23-162-g1dbcd934-dirty.
      # In a clone without tags, the commit alone.
      VERSION:
        sh: git describe --tags --always --dirty --match='v*' | sed 's/^v//'

  build:docker:
    desc: Build the Docker image, which builds and tests frontend and backend itself
    cmds:
      # The image gets the name that compose.yaml runs, and the whole commit hash, as in CI: the
      # Dockerfile cuts it to seven characters for the binary and keeps it whole in the image's
      # label. --pull gets the base images' latest security patches.
      - docker build --pull --build-arg VERSION={{.VERSION}} --build-arg GIT_SHA={{.GIT_SHA}} -t filebrowser:local .
    vars:
      GIT_SHA:
        sh: git rev-parse HEAD
      # As for build:backend.
      VERSION:
        sh: git describe --tags --always --dirty --match='v*' | sed 's/^v//'

  build:
    desc: Build both frontend and backend
    cmds:
      - task: build:frontend
      - task: build:backend

  # A version is released by its tag: pushing the tag starts the release job of
  # .github/workflows/ci.yaml. The tasks below make the tag, with the section of CHANGELOG.md for
  # it. They push nothing. CONTRIBUTING.md describes the whole procedure.
  release:
    desc: "Tag a release, such as v3.0.0: the version follows from the commits since the last release"
    preconditions:
      # The fork's first tag is a candidate. From the original project's last tag, this task would
      # tag v3.0.0 at once, a full release.
      - sh: 'case "$(git describe --tags --abbrev=0 --match "v*" 2> /dev/null)" in v2.*) false ;; esac'
        msg: "The last version tag is the original project's, a v2: this fork has no release candidate yet, and its first tag is one. Tag it first: task release:rc VERSION=3.0.0"
    cmds:
      - task: release:check
      - task: release:docs
      - task: release:dry-run
      - task: release:make

  release:rc:
    desc: "Tag a release candidate: with VERSION=3.0.0 the first one of that version, v3.0.0-rc.1, and without it the next one"
    vars:
      # The first candidate of a version is asked for by name. The tool would count from 0
      # otherwise, and take the version from the commits, as `task release` does.
      FLAGS: '{{if .VERSION}}--release-as {{.VERSION}}-rc.1{{else}}--prerelease rc{{end}}'
    preconditions:
      - sh: '[ -z "{{.VERSION}}" ] || printf "%s" "{{.VERSION}}" | grep -Eq "^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"'
        msg: "VERSION is the version without a v and without a suffix, such as 3.0.0."
      - sh: '[ -z "{{.VERSION}}" ] || ! git rev-parse -q --verify "refs/tags/v{{.VERSION}}-rc.1" > /dev/null'
        msg: "v{{.VERSION}}-rc.1 exists. Run `task release:rc` without VERSION for the next candidate."
      - sh: '[ -n "{{.VERSION}}" ] || git describe --tags --abbrev=0 --match "v*" | grep -q -e "-rc\.[0-9][0-9]*$"'
        msg: "The last version tag is not a release candidate. Name the version of the first one: task release:rc VERSION=3.0.0"
    cmds:
      - task: release:check
      - task: release:docs
      - task: release:dry-run
        vars:
          FLAGS: '{{.FLAGS}}'
      - task: release:make
        vars:
          FLAGS: '{{.FLAGS}}'

  # What a release needs is checked before anything is written or deleted. A run that fails at its
  # commit leaves the new section in CHANGELOG.md, written and staged, and the next run would put
  # the section there a second time, in the commit that is tagged. The commit fails most often
  # because it cannot be signed, so one is signed here as a trial: an object that no branch or tag
  # leads to, which changes neither the index nor a file. A run that fails at its tag leaves the
  # release commit without one, and the next run would make a second release commit, with the same
  # section a second time.
  release:check:
    internal: true
    preconditions:
      - sh: 'command -v go > /dev/null && command -v pnpm > /dev/null'
        msg: "A release needs Go and pnpm on the PATH."
      - sh: 'git diff --quiet HEAD -- CHANGELOG.md'
        msg: "CHANGELOG.md has changes that are not committed, which a failed run leaves behind. Undo them first: git restore --staged --worktree CHANGELOG.md"
      - sh: '! git log -1 --format=%s | grep -q "^chore(release): " || git describe --exact-match --tags HEAD > /dev/null 2>&1'
        msg: "The last commit is a release commit without a tag, which a run that failed at its tag leaves behind: another run would put its section in CHANGELOG.md a second time. Tag that commit by hand, with the version in its subject, such as: git tag -a{{if .SIGN}} {{.SIGN}}{{end}} v3.0.0-rc.1 -m 'chore(release): 3.0.0-rc.1'. Or take the commit back and run the task again: git reset --keep HEAD^"
      - sh: '[ -z "{{.SIGN}}" ] || git commit-tree -S -m "signing check" "HEAD^{tree}" < /dev/null > /dev/null 2>&1'
        msg: "Git cannot sign a commit here, and a release is signed. It needs a signing key in the Git configuration, which CONTRIBUTING.md describes under Release. This shows Git's error and changes nothing: git commit-tree -S -m test 'HEAD^{tree}'"

  release:docs:
    internal: true
    cmds:
      - task: docs:cli:generate
      - git add docs/cli
      - |
        if [ -n "$(git status docs/cli --porcelain)" ]; then
          git commit -m 'chore(docs): update CLI documentation'
        fi

  # The tool is pinned to one version, like everything else that a release runs. Where the links
  # in the changelog go is set in .versionrc, so it does not depend on the clone's remotes.
  release:dry-run:
    internal: true
    cmds:
      - pnpm dlx commit-and-tag-version@13.3.0 --dry-run {{.FLAGS}}

  release:make:
    internal: true
    prompt: Do you wish to proceed?
    cmds:
      - pnpm dlx commit-and-tag-version@13.3.0 {{.SIGN}} {{.FLAGS}}

  docs:cli:generate:
    # Before the reference is deleted, not after.
    preconditions:
      - sh: 'command -v go > /dev/null'
        msg: "The command line reference is generated with Go, which is not on the PATH."
    cmds:
      - rm -rf docs/cli
      - mkdir -p docs/cli
      - go run . docs
    generates:
      - docs/cli

