# Builds the image from this repository and runs it:
#
#   docker compose up --build
#
# The image is built on Docker Hardened Images, which need a `docker login dhi.io` to pull.
#
# This is all that one File Browser instance needs. compose.redis.yaml adds the Redis that
# several instances share.

name: filebrowser

services:
  filebrowser:
    build:
      context: .
      args:
        # The version and the commit that the binary and the web client show. Both are optional.
        VERSION: ${VERSION:-}
        GIT_SHA: ${GIT_SHA:-}
    image: ${FILEBROWSER_IMAGE:-filebrowser:local}
    restart: unless-stopped
    # When it is told to stop, the server gives the requests in progress 8 seconds to finish
    # (FB_SHUTDOWN_TIMEOUT), then cuts them off and closes the database. This has to be longer, or
    # Docker kills it first.
    stop_grace_period: 15s
    # The container needs no capability, no new privilege and no writable root filesystem: what it
    # writes goes to the volumes and the tmpfs mount below.
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    # The image's own user. Bind mounts used instead of the volumes below must be writable by it.
    user: '1000:1000'
    # Go starts a thread for each file operation that blocks, so this is not as low as it could be
    # for a single process.
    pids_limit: 256
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    # Only reachable from this machine: put a reverse proxy with TLS in front of it, or change the
    # address to publish it as it is.
    ports:
      - '127.0.0.1:${FILEBROWSER_PORT:-8000}:80'
    # The files to serve, the settings and the database.
    volumes:
      - data:/srv
      - config:/config
      - database:/database

# With the project name at the top, Docker names these filebrowser_data, filebrowser_config and
# filebrowser_database. Those are the volumes of the `docker run` command in File Browser's own
# documentation, so an installation that was started with it keeps its files, settings and users
# here. Compose then warns that it did not create the volumes, which is expected. Under another
# project name (-p), the volumes are new and empty.
volumes:
  data:
  config:
  database:
