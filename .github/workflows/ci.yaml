name: Continuous Integration

on:
  push:
    branches:
      - "master"
      - "modernize"
    tags:
      - "v*"
  pull_request:

# What the token of every job may do, unless the job says otherwise: read the repository.
permissions:
  contents: read

# One run at a time for a branch or a pull request: a newer run takes the place of the one before
# it, so the one runner is not kept busy with a commit that has been replaced. The run of a
# version tag is in a group of its own and is never cancelled, so a release in progress finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Every script is run by bash, with `-eo pipefail`, and a runner without bash fails at once.
defaults:
  run:
    shell: bash

# Where the jobs run, and for whom. Every job starts with the same lines, and they are the same in
# lint-pr.yaml:
#
#   if:       the repository variable BUILD_RUNNER is set (Settings, Secrets and variables,
#             Actions, Variables), and the run comes from someone who may push to this repository:
#             a push, or a pull request from a branch of this repository. A pull request from a
#             fork runs nothing. Without the variable every job is skipped, so a repository whose
#             runner is not set up runs nothing either. A job with more conditions has them after
#             these, joined with `&&`.
#   runs-on:  the self-hosted runner that carries the label in BUILD_RUNNER. `self-hosted` is the
#             label that every self-hosted runner has and that none of GitHub's own has, so no
#             value of the variable sends a job to a runner of GitHub. The label after `||` is one
#             that no runner has: it only keeps the line valid in a job that is skipped.
#   timeout-minutes: a job that hangs gives the runner back.
#
# The condition is in this file, and a pull request can change this file. What keeps a pull
# request from a fork off the runner is the repository's setting that a maintainer approves its
# runs first: see CONTRIBUTING.md.
#
# Actions are pinned to a commit, with the version it belongs to after it, so that a tag that is
# moved later does not change what runs here.
jobs:
  lint-frontend:
    name: Lint Frontend
    if: >-
      vars.BUILD_RUNNER != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, "${{ vars.BUILD_RUNNER || 'no-runner-configured' }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend:
    name: Test Frontend
    if: >-
      vars.BUILD_RUNNER != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, "${{ vars.BUILD_RUNNER || 'no-runner-configured' }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

  lint-backend:
    name: Lint Backend
    if: >-
      vars.BUILD_RUNNER != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, "${{ vars.BUILD_RUNNER || 'no-runner-configured' }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"
      # The linter is pinned like the actions are. With `latest`, a new release of it that finds
      # something new fails this job on a commit that changed nothing, and the release with it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "v2.15.0"

  test:
    name: Test
    if: >-
      vars.BUILD_RUNNER != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, "${{ vars.BUILD_RUNNER || 'no-runner-configured' }}"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"
      # The longest package takes most of the ten minutes that a package gets by default.
      - run: go test --race -timeout 20m ./...

  build:
    name: Build
    if: >-
      vars.BUILD_RUNNER != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, "${{ vars.BUILD_RUNNER || 'no-runner-configured' }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      # Task itself is pinned too: the action installs the newest 3.x otherwise.
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.54.0"
      - run: task build

  docker:
    name: Build Docker image
    # A version tag is built by the release job.
    if: >-
      vars.BUILD_RUNNER != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/modernize')
    runs-on: [self-hosted, "${{ vars.BUILD_RUNNER || 'no-runner-configured' }}"]
    timeout-minutes: 45
    env:
      # The Dockerfile's base images need a login to dhi.io. A repository may not have the
      # secrets for it, and a pull request that Dependabot opens is not given them: the image is
      # then not built, and the job says so instead of failing.
      DHI_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: No login for Docker Hardened Images
        if: env.DHI_LOGIN != 'true'
        run: echo "::notice::The Docker image was not built, because the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not available to this run."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: env.DHI_LOGIN == 'true'
      - name: Set up Docker Buildx
        if: env.DHI_LOGIN == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hardened Images
        if: env.DHI_LOGIN == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The same build as in the release job, for the runner's own platform and without a push,
      # so that a Dockerfile that no longer builds is found before there is a tag. The Dockerfile
      # runs the tests of the client and the server itself.
      - name: Build Docker image
        if: env.DHI_LOGIN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}

  release:
    name: Release
    needs: ["lint-frontend", "test-frontend", "lint-backend", "test", "build"]
    # Only for a version tag, and only in a repository that says where its images go: the
    # repository variable IMAGE_NAME (Settings, Secrets and variables, Actions, Variables), in lower
    # case. It is the name of an image on Docker Hub, which for this fork is
    # werewolfboy13/filebrowser. Images go to Docker Hub and to no other registry, so that anyone
    # can pull them without a login. Without the variable nothing is released, so a tag pushed to
    # a fork that was not set up publishes nothing.
    if: >-
      vars.BUILD_RUNNER != '' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.IMAGE_NAME != ''
    runs-on: [self-hosted, "${{ vars.BUILD_RUNNER || 'no-runner-configured' }}"]
    timeout-minutes: 90
    permissions:
      # GoReleaser creates the GitHub release. The image is pushed with the Docker Hub secrets, not
      # with this job's token.
      contents: write
    steps:
      # The name is checked before anything is built. File Browser's own images and those of
      # this build are different things, so only the organization that owns them may publish
      # under its names.
      - name: Docker image name and tags
        id: image
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          # First, the name and the tag are held to what they may be made of. The step that
          # pushes the image takes its tags as a list, which it splits at line breaks and commas
          # and trims: with a space before it, or a comma or a line break in it, what is checked
          # below would not be what is pushed. The name is [registry[:port]/]path, in lower case
          # and without a tag: which registry is looked at further down. The whole value is
          # matched, line breaks included.
          LC_ALL=C
          host='[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]+)?'
          part='[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*'
          if [[ ! "$IMAGE_NAME" =~ ^($host/)?$part(/$part)*$ ]]; then
            echo "::error::IMAGE_NAME has to be the name of an image on Docker Hub, in lower case, with no tag and nothing around it, such as werewolfboy13/filebrowser."
            exit 1
          fi
          # The Git tag has to be a version: v, three numbers without leading zeros, and for a
          # prerelease a hyphen and what it is, such as v3.0.0 or v3.0.0-rc.1. Any other tag
          # that starts with a v, such as vnext or v3, would be released as a version, and move
          # `latest`. The tag also becomes the tag of the image, which takes at most 128
          # characters and no plus sign, so build metadata, as in v3.0.0+build, is not taken.
          # A part of a prerelease's name that is all digits is a number as well, without a
          # leading zero: GoReleaser refuses v3.0.0-rc.01, and it runs after the image is pushed.
          number='(0|[1-9][0-9]*)'
          word="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v$number\.$number\.$number(-$word(\.$word)*)?$ ]] || [ "${#GITHUB_REF_NAME}" -gt 128 ]; then
            echo "::error::The tag has to be a version, such as v3.0.0, or v3.0.0-rc.1 for a prerelease: v, three numbers without leading zeros, and for a prerelease a hyphen and its name, in which a number has no leading zero either. It becomes the tag of the image."
            exit 1
          fi

          # Images are published to Docker Hub and to no other registry. A name on Docker Hub is
          # owner/name, alone or with docker.io/ before it. As Docker reads a name with a slash in
          # it, the part before the first slash is a registry when it has a dot or a port in it,
          # or is localhost. With any of those the image would go somewhere else, where this job
          # has no login and where pulling may take one. Docker Hub's other host names, such as
          # index.docker.io, are not taken either: one image, one way to write it.
          repository=${IMAGE_NAME#docker.io/}
          first=${repository%%/*}
          if [ "$first" != "$repository" ]; then
            case "$first" in
              *.* | *:* | localhost)
                echo "::error::IMAGE_NAME is $IMAGE_NAME, which names a registry. Images are published to Docker Hub only, where a name is written owner/name or docker.io/owner/name, such as werewolfboy13/filebrowser."
                exit 1
                ;;
            esac
          fi
          # On Docker Hub a name has two parts: the account and the repository.
          if [[ ! "$repository" =~ ^$part/$part$ ]]; then
            echo "::error::IMAGE_NAME is $IMAGE_NAME, which is not the name of an image on Docker Hub. That is owner/name, such as werewolfboy13/filebrowser."
            exit 1
          fi

          case "$repository" in
            filebrowser/*)
              if [ "$GITHUB_REPOSITORY_OWNER" != "filebrowser" ]; then
                echo "::error::IMAGE_NAME is $IMAGE_NAME, which belongs to the File Browser project. Use a name of your own."
                exit 1
              fi
              ;;
          esac

          # The tags are made from the name in the form that was checked, not from the value of
          # the variable. For the tag v3.1.4, the version is 3.1.4 and the major tag is v3. A
          # tag with a hyphen, which the check above leaves to a prerelease such as v3.0.0-rc.1,
          # gets its own tag only: neither the major tag nor `latest` moves to it.
          image=docker.io/$repository
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "tags<<END_OF_TAGS"
            echo "$image:$GITHUB_REF_NAME"
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *)
                echo "$image:${GITHUB_REF_NAME%%.*}"
                echo "$image:latest"
                ;;
            esac
            echo "END_OF_TAGS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      # Task itself is pinned too: the action installs the newest 3.x otherwise.
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.54.0"
      - run: task build:frontend
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The image is pushed to Docker Hub with these secrets. The token has to be allowed to
      # write to the repository of the image.
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The Dockerfile's base images are Docker Hardened Images. Their registry takes the same
      # Docker Hub account.
      - name: Login to Docker Hardened Images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The Dockerfile builds File Browser from source and runs the tests itself, so an image that
      # fails them is never pushed. It comes before GoReleaser, so that a failed image build leaves
      # no release behind, and the job can simply run again.
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=filebrowser
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.image.outputs.tags }}
      # The release is created in this repository, with this job's token. GoReleaser is pinned
      # to one release, like the actions: this job may write to the repository and holds the
      # Docker Hub token, and with a range such as "~> v2" it would run whatever was released last.
      # .goreleaser.yml is written for version 2.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.20.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
