name: Continuous Integration

on:
  push:
    branches:
      - "master"
      - "modernize"
    tags:
      - "v*"
  pull_request:

# What the token of every job may do, unless the job says otherwise: read the repository.
permissions:
  contents: read

# Actions are pinned to a commit, with the version it belongs to after it, so that a tag that is
# moved later does not change what runs here.
jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"
      # The linter is pinned like the actions are. With `latest`, a new release of it that finds
      # something new fails this job on a commit that changed nothing, and the release with it.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "v2.15.0"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.x"
      # The longest package takes most of the ten minutes that a package gets by default.
      - run: go test --race -timeout 20m ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      # Task itself is pinned too: the action installs the newest 3.x otherwise.
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.54.0"
      - run: task build

  docker:
    name: Build Docker image
    # A version tag is built by the release job.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/modernize'
    runs-on: ubuntu-latest
    env:
      # The Dockerfile's base images need a login to dhi.io. The secrets for it are not given to
      # pull requests from forks, and a repository may not have them at all: the image is then
      # not built, and the job says so instead of failing.
      DHI_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: No login for Docker Hardened Images
        if: env.DHI_LOGIN != 'true'
        run: echo "::notice::The Docker image was not built, because the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not available to this run."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: env.DHI_LOGIN == 'true'
      - name: Set up Docker Buildx
        if: env.DHI_LOGIN == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hardened Images
        if: env.DHI_LOGIN == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The same build as in the release job, for the runner's own platform and without a push,
      # so that a Dockerfile that no longer builds is found before there is a tag. The Dockerfile
      # runs the tests of the client and the server itself.
      - name: Build Docker image
        if: env.DHI_LOGIN == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}

  release:
    name: Release
    needs: ["lint-frontend", "test-frontend", "lint-backend", "test", "build"]
    # Only for a version tag, and only in a repository that says where its images go: the
    # repository variable IMAGE_NAME (Settings, Secrets and variables, Actions, Variables), in lower
    # case. For this fork that is ghcr.io/werewolfboy13/filebrowser, which is pushed with this
    # job's own token. A name without a registry, such as owner/filebrowser, is one on Docker Hub.
    # Without the variable nothing is released, so a tag pushed to a fork that was not set up
    # publishes nothing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.IMAGE_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      # GoReleaser creates the GitHub release.
      contents: write
      # The image is pushed with this job's token when IMAGE_NAME is on ghcr.io.
      packages: write
    steps:
      # The name is checked before anything is built. File Browser's own images and those of
      # this build are different things, so only the organization that owns them may publish
      # under its names.
      - name: Docker image name and tags
        id: image
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          # First, the name and the tag are held to what they may be made of. The step that
          # pushes the image takes its tags as a list, which it splits at line breaks and commas
          # and trims: with a space before it, or a comma or a line break in it, what is checked
          # below would not be what is pushed. The name is [registry[:port]/]path, in lower case
          # and without a tag. The whole value is matched, line breaks included.
          LC_ALL=C
          host='[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]+)?'
          part='[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*'
          if [[ ! "$IMAGE_NAME" =~ ^($host/)?$part(/$part)*$ ]]; then
            echo "::error::IMAGE_NAME has to be the name of an image, in lower case, with no tag and nothing around it, such as ghcr.io/werewolfboy13/filebrowser."
            exit 1
          fi
          # The Git tag has to be a version: v, three numbers without leading zeros, and for a
          # prerelease a hyphen and what it is, such as v3.0.0 or v3.0.0-rc.1. Any other tag
          # that starts with a v, such as vnext or v3, would be released as a version, and move
          # `latest`. The tag also becomes the tag of the image, which takes at most 128
          # characters and no plus sign, so build metadata, as in v3.0.0+build, is not taken.
          # A part of a prerelease's name that is all digits is a number as well, without a
          # leading zero: GoReleaser refuses v3.0.0-rc.01, and it runs after the image is pushed.
          number='(0|[1-9][0-9]*)'
          word="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v$number\.$number\.$number(-$word(\.$word)*)?$ ]] || [ "${#GITHUB_REF_NAME}" -gt 128 ]; then
            echo "::error::The tag has to be a version, such as v3.0.0, or v3.0.0-rc.1 for a prerelease: v, three numbers without leading zeros, and for a prerelease a hyphen and its name, in which a number has no leading zero either. It becomes the tag of the image."
            exit 1
          fi

          # One image has many names. The registry can be left out, which means Docker Hub, and
          # Docker Hub goes by several host names. So the name is brought into one form first:
          # registry/repository, with docker.io for Docker Hub.
          registry=${IMAGE_NAME%%/*}
          case "$IMAGE_NAME" in
            */*) repository=${IMAGE_NAME#*/} ;;
            *) registry='' repository=$IMAGE_NAME ;;
          esac
          case "$registry" in
            # As Docker reads it: the part before the first slash is a registry when it has a
            # dot or a port in it, or is localhost.
            *.* | *:* | localhost) ;;
            *) registry=docker.io repository=$IMAGE_NAME ;;
          esac
          # Whose registry it is does not depend on the port.
          host=${registry%%:*}
          case "$host" in
            docker.io | index.docker.io | registry-1.docker.io | registry.hub.docker.com)
              host=docker.io registry=docker.io repository=${repository#library/}
              ;;
          esac

          case "$host/$repository" in
            docker.io/filebrowser/* | ghcr.io/filebrowser/*)
              if [ "$GITHUB_REPOSITORY_OWNER" != "filebrowser" ]; then
                echo "::error::IMAGE_NAME is $IMAGE_NAME, which belongs to the File Browser project. Use a name of your own."
                exit 1
              fi
              ;;
          esac

          # The tags are made from the name in the form that was checked, not from the value of
          # the variable. For the tag v3.1.4, the version is 3.1.4 and the major tag is v3. A
          # tag with a hyphen, which the check above leaves to a prerelease such as v3.0.0-rc.1,
          # gets its own tag only: neither the major tag nor `latest` moves to it.
          image=$registry/$repository
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "tags<<END_OF_TAGS"
            echo "$image:$GITHUB_REF_NAME"
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *)
                echo "$image:${GITHUB_REF_NAME%%.*}"
                echo "$image:latest"
                ;;
            esac
            echo "END_OF_TAGS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      # Task itself is pinned too: the action installs the newest 3.x otherwise.
      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: "3.54.0"
      - run: task build:frontend
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # For an image on Docker Hub.
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The Dockerfile's base images are Docker Hardened Images. Their registry takes the same
      # Docker Hub account.
      - name: Login to Docker Hardened Images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # For an image on GitHub's registry, which takes this job's own token.
      - name: Login to GitHub Container Registry
        if: startsWith(vars.IMAGE_NAME, 'ghcr.io/')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile builds File Browser from source and runs the tests itself, so an image that
      # fails them is never pushed. It comes before GoReleaser, so that a failed image build leaves
      # no release behind, and the job can simply run again.
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=filebrowser
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.image.outputs.tags }}
      # The release is created in this repository, with this job's token. GoReleaser is pinned
      # to one release, like the actions: this job may write to the repository and to its
      # packages, and with a range such as "~> v2" it would run whatever was released last.
      # .goreleaser.yml is written for version 2.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.20.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
